<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal</title>
<meta name="theme-color" content="#0E1420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-row">
      <h1 class="wordmark">Signal</h1>
      <p class="stamp" id="stamp">Loading</p>
    </div>

    <div class="readout" id="readout" aria-hidden="true"></div>
    <p class="readout-stat">
      <span id="scanned">0</span> scanned · <span id="kept">0</span> kept
    </p>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main id="sections"></main>

  <footer class="foot">
    <button class="refresh" id="refresh" type="button">Refresh</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
